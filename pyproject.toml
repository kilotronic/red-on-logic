[project]
name = "red-on-logic"
version = "0.0.0"
description = "Prove a pull request's new tests test something: they must fail on the base branch's code with a wrong answer, not an import error."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
red-on-logic = "red_on_logic.cli:entry"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14", "pyright>=1.1.400"]

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/red_on_logic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT"]
ignore = [
  "S603", # subprocess with a fixed program and argv list, never a shell
  "S607", # git, node and the test runners are found on PATH
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
